<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" href="/assets/morrow-logo-mark.svg" type="image/svg+xml" />
    <title>Merchant sign-in · Morrow</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/states.css" />
  </head>
  <body class="login-page">
    <a class="skip" href="#main">Skip to main content</a>
    <aside class="login-brand">
      <a class="brand" href="/"
        ><img src="/assets/morrow-logo-mark.svg" alt="" />morrow</a
      >
    </aside>
    <main id="main" class="login-main">
      <h1 class="page-title">Merchant sign-in</h1>
      <p id="auth-config-status" class="notice" role="status">
        Loading sign-in…
      </p>
      <div id="form-error" class="notice error" role="alert" hidden></div>
      <section id="privy-auth" hidden aria-label="Merchant sign-in with Privy">
        <div id="privy-root"></div>
        <div id="privy-error" class="notice error" role="alert" hidden></div>
      </section>
      <form id="login-form" class="login-form" novalidate hidden>
        <label class="field" for="email">
          <span class="label-text">Work email</span>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@yourshop.example"
            aria-describedby="email-error"
            required
          />
          <span class="field-error" id="email-error"></span>
        </label>

        <label class="field" for="password">
          <span class="label-text">Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            aria-describedby="password-error"
            required
          />
          <span class="field-error" id="password-error"></span>
        </label>

        <button class="btn" id="submit" type="submit">
          Sign in to your workspace
        </button>
      </form>
      <p class="hint">
        <a href="/demo">Explore demo without signing in</a>
      </p>
      <p id="auth-unavailable" class="notice error" role="alert" hidden>
        Sign-in is not configured. Nothing was changed.
      </p>
    </main>
    <script src="/assets/app.js"></script>
    <script src="/assets/merchant-login.js"></script>
  </body>
</html>
